plugins {
    id 'org.springframework.boot'
}

description = 'Example API'

configurations {
    mockitoAgent { transitive = false }
}

dependencies {
    implementation project(':microservices:common')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation libs.archunit

    mockitoAgent 'org.mockito:mockito-core' // explicit agent: self-attach is deprecated on JDK 21+
}

tasks.withType(Test).configureEach {
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

// *IT (precisam de Docker) rodam em integrationTest; o resto em test.
test {
    filter {
        excludeTestsMatching("*IT")
        failOnNoMatchingTests = false
    }
}

tasks.register('integrationTest', Test) {
    description = 'Run integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
    filter { includeTestsMatching "*IT" }
}

tasks.named('check') { dependsOn integrationTest }

bootJar { archiveFileName = 'example-api.jar' }

tasks.register('dockerBuild', Exec) {
    description = 'Builds the Docker image'
    group = 'build'
    dependsOn('bootJar')
    workingDir project.projectDir
    commandLine 'docker', 'build', '.', '-t', 'highonline/example-api:dev'
}
