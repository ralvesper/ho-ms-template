plugins {
    id 'org.springframework.boot'
    id 'org.springframework.cloud.contract' version '5.0.0'
}

description = 'Example API'

configurations {
    mockitoAgent { transitive = false }
}

ext {
    set('springCloudVersion', '2025.0.1')
}

dependencies {
    implementation project(':microservices:common')
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-database-postgresql'

    implementation 'commons-validator:commons-validator:1.10.1'
    implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'
    implementation 'io.hypersistence:hypersistence-tsid:2.1.4'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier'
    testImplementation 'org.assertj:assertj-core:3.27.6'
    constraints {
        testImplementation('io.rest-assured:rest-assured:6.0.0') { version { strictly '6.0.0' } }
        testImplementation('io.rest-assured:spring-mock-mvc:6.0.0') { version { strictly '6.0.0' } }
    }

    mockitoAgent 'org.mockito:mockito-core'
}

dependencyManagement {
    imports { mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}" }
}

// Contratos em src/contractTest/resources/contracts; testes gerados estendem ContractBase.
contracts {
    baseClassForTests = 'com.highonline.exampleapi.ContractBase'
}

// *IT (precisam de Docker) rodam em integrationTest; o resto em test.
test {
    filter { excludeTestsMatching("*IT") }
}

tasks.register('integrationTest', Test) {
    description = 'Run integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
    filter { includeTestsMatching "*IT" }
}

tasks.withType(Test).configureEach {
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

tasks.named('check') { dependsOn contractTest, integrationTest }

bootJar { archiveFileName = 'example-api.jar' }

tasks.register('dockerBuild', Exec) {
    description = 'Builds the Docker image'
    group = 'build'
    dependsOn('bootJar')
    workingDir project.projectDir
    commandLine 'docker', 'build', '.', '-t', 'highonline/example-api:dev'
}
